version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_HOST: '54.227.99.5'
      DATABASE_PORT: 3306
      DATABASE_NAME: 'sitetransition'
      DATABASE_USER: 'forge'
      DATABASE_PASSWORD: 'OMdrIKysPtzxdDhX3jU8'
      NEXT_PUBLIC_API_URL: https://breakingmedia.ai
    volumes:
      - .:/app
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nextjs_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
